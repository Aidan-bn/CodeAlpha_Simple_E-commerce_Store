<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="header-pages">
      <nav>
        <!-- <strong class="logo">BOt</strong> -->
        <img src="../images/logo.png" alt="logo" class="logo" />
        <div class="nav-list">
          <menu>
            <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="order.html">Order</a>
          </menu>
          <div class="nav-action">
            <img src="../images/notification.svg" alt="bell" class="bell" />
            <a href="../pages/login.html" class="btn-login">Log in</a>
          </div>
        </div>
      </nav>
      <form action="" class="form-login">
        <label for="user-name">
          User Name:
          <input type="text" name="user-name" placeholder="Enter user name" />
        </label>
        <label for="user-password">
          Password:
          <input type="password" name="password" placeholder="Enter Password" />
        </label>
        <div class="div-login">
          <button>Log In</button>
          
          <a href="./register.html">Register</a>
          <div class="register-div">
            <div class="register">
              <form action="" class="form-login overlay">
              <label for="user-name">
                Full Name:
                <input
                  type="text"
                  name="user-name"
                  placeholder="Enter names"
                />
              </label>
              <label for="email">
                Email:
                <input
                  type="text"
                  name="email"
                  placeholder="Enter email address"
                />
              </label>
              <label for="phone">
                Phone:
                <input
                  type="text"
                  name="user-phone"
                  placeholder="Enter phone number"
                />
              </label>
              <label for="user-name">
                Password:
                <input
                  type="password"
                  name="password"
                  placeholder="Enter Password"
                />
              </label>
              <div class="div-login">
                <button>Register</button>
              </div>
            </form>
            </div>
          </div>
        </div>
      </form>
    </header>
  </body>
</html>
